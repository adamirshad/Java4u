name: Goose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    defaults:
      run:
        working-directory: goose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: goose/go.mod
          cache-dependency-path: goose/go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: goose/go.mod
          cache-dependency-path: goose/go.sum
      - name: Cross-compile
        run: |
          set -e
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            out=dist/goose-$os-$arch
            ext=""; guiflags="-s -w"
            if [ "$os" = windows ]; then ext=".exe"; guiflags="-s -w -H=windowsgui"; fi
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out/goose$ext" ./cmd/goose
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$guiflags" -o "$out/goose-gui$ext" ./cmd/goose-gui
            cp README.md "$out/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: goose-binaries
          path: goose/dist/
