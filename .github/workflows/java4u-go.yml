name: Java4U

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS finish so one failure doesn't hide another.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    defaults:
      run:
        working-directory: java4u-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: java4u-go/go.mod
          cache-dependency-path: java4u-go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test Chunky (the mod loader)
        run: go run ./tools/buildchunky -test
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java4u-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: java4u-go/go.mod
          cache-dependency-path: java4u-go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Chunky (embedded in every Java4U binary)
        run: go run ./tools/buildchunky
      - name: App icon
        run: go run ./tools/mkicon
      - name: Windows icon and version info (same as release builds)
        run: |
          set -e
          for cmd in java4u java4u-gui; do
            manifest=cli
            if [ "$cmd" = java4u-gui ]; then manifest=gui; fi
            (cd "cmd/$cmd" && go run github.com/tc-hib/go-winres@v0.3.3 simply \
              --arch amd64,arm64 --manifest "$manifest" --icon ../../build/java4u.ico \
              --product-name Java4U --product-version 0.0.0.0 --file-version 0.0.0.0 \
              --file-description "Java4U Minecraft launcher" --original-filename "$cmd.exe")
          done
      - name: Cross-compile
        run: |
          set -e
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            out=dist/java4u-$os-$arch
            ext=""; guiflags="-s -w"
            if [ "$os" = windows ]; then ext=".exe"; guiflags="-s -w -H=windowsgui"; fi
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out/java4u$ext" ./cmd/java4u
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$guiflags" -o "$out/java4u-gui$ext" ./cmd/java4u-gui
            cp README.md "$out/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: java4u-binaries
          path: |
            java4u-go/dist/
            java4u-go/build/

  # Builds the Windows installer the same way release.yml does, so a broken installer
  # script shows up here rather than on release day.
  installer:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: java4u-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: java4u-binaries
          path: java4u-go
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=0.0.0-ci" "/DArch=amd64" "packaging\windows\java4u.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: java4u-installer
          path: java4u-go/dist/java4u-setup-*.exe

  # Builds the macOS disk image the same way release.yml does.
  dmg:
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: java4u-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: java4u-binaries
          path: java4u-go
      - name: Build the macOS app and disk image
        run: sh packaging/macos/build-dmg.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: java4u-dmg
          path: java4u-go/dist/java4u-macos.dmg
