name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Cargo workspace lives in java4u/, not the repository root.
        working-directory: java4u
    steps:
    - uses: actions/checkout@v5
    - name: Install system libraries
      # GTK 3 is needed by the desktop app's file picker (rfd).
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
