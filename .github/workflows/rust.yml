name: Rust (archived launcher)

on:
  push:
    branches: [ "main" ]
    paths: [ "archive/rust/**", ".github/workflows/rust.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "archive/rust/**", ".github/workflows/rust.yml" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The old Rust launcher, kept for reference in archive/rust.
        working-directory: archive/rust
    steps:
    - uses: actions/checkout@v5
    - name: Install system libraries
      # GTK 3 is needed by the desktop app's file picker (rfd).
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
