name: Release

# Push a tag like v0.2.0 to build every platform, the Windows installers and
# checksums.txt, and publish them as a GitHub Release. Java4U's updater reads that release.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java4u-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: java4u-go/go.mod
          cache-dependency-path: java4u-go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build Chunky (embedded in every Java4U binary)
        run: go run ./tools/buildchunky
      - run: go test ./...
      - name: App icon
        run: go run ./tools/mkicon
      - name: Windows icon and version info
        run: |
          set -e
          ver4="$(echo "$VERSION" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3.0/')"
          for cmd in java4u java4u-gui; do
            manifest=cli
            if [ "$cmd" = java4u-gui ]; then manifest=gui; fi
            (cd "cmd/$cmd" && go run github.com/tc-hib/go-winres@v0.3.3 simply \
              --arch amd64,arm64 --manifest "$manifest" --icon ../../build/java4u.ico \
              --product-name Java4U --product-version "$ver4" --file-version "$ver4" \
              --file-description "Java4U Minecraft launcher" --original-filename "$cmd.exe" \
              --copyright "Java4U contributors")
          done
      - name: Cross-compile and zip
        run: |
          set -e
          ver="-X github.com/adamirshad/Java4u/java4u-go/internal/core.Version=$VERSION"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=java4u-$os-$arch
            out=dist/$name
            ext=""; gui=""
            if [ "$os" = windows ]; then ext=".exe"; gui="-H=windowsgui"; fi
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w $ver" -o "$out/java4u$ext" ./cmd/java4u
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w $gui $ver" -o "$out/java4u-gui$ext" ./cmd/java4u-gui
            cp README.md "$out/"
            (cd dist && zip -qr "$name.zip" "$name")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            java4u-go/dist/
            java4u-go/build/

  installer:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: java4u-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: java4u-go
      - name: Build installers
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          foreach ($arch in "amd64", "arm64") {
            & $iscc "/DAppVersion=$version" "/DArch=$arch" "packaging\windows\java4u.iss"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-installers
          path: java4u-go/dist/java4u-setup-*.exe

  dmg:
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: java4u-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: java4u-go
      - name: Build the macOS app and disk image
        run: sh packaging/macos/build-dmg.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dmg
          path: java4u-go/dist/java4u-macos.dmg

  publish:
    needs: [ build, installer, dmg ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: release-installers
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: release-dmg
          path: files
      - name: Collect files and checksums
        run: |
          set -e
          cp build/dist/*.zip files/
          cd files
          sha256sum *.zip *.exe *.dmg > checksums.txt
          cat checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Java4U ${GITHUB_REF_NAME#v}" --generate-notes $pre \
            files/*.zip files/*.exe files/*.dmg files/checksums.txt
